name: materialize-paper-files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-paper-files.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the PDF build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-science texlive-pictures \
            texlive-fonts-recommended fonts-inter fonts-dejavu-core poppler-utils
          python -m pip install --quiet numpy matplotlib

      - name: Build the complete LaTeX source and PDF inside the repository
        run: |
          set -euo pipefail
          python paper/make_figures.py
          cat paper/parts/part_*.tex > paper/MorphoQL_Paper_English.tex
          test "$(stat -c%s paper/MorphoQL_Paper_English.tex)" -eq 84847
          echo '486fbfbc57c53c610e7d38401125c3349fb1111b6fc66b572e67742b775f2ab1  paper/MorphoQL_Paper_English.tex' | sha256sum -c -
          grep -q 'MorphoQL: Declarative Morphological Queries' paper/MorphoQL_Paper_English.tex
          grep -q '\\end{document}' paper/MorphoQL_Paper_English.tex
          (cd paper && latexmk -xelatex -interaction=nonstopmode -halt-on-error MorphoQL_Paper_English.tex)
          test -s paper/MorphoQL_Paper_English.pdf
          test "$(pdfinfo paper/MorphoQL_Paper_English.pdf | awk '/^Pages:/ {print $2}')" -eq 31
          head -c 5 paper/MorphoQL_Paper_English.pdf | grep -q '%PDF-'
          tail -c 4096 paper/MorphoQL_Paper_English.pdf | grep -q '%%EOF'
          sha256sum paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex
          ls -lh paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex

      - name: Replace external links with repository-local files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          text = re.sub(
              r'- \[English paper \(PDF\)\]\([^\n]+\)',
              '- [English paper (PDF)](paper/MorphoQL_Paper_English.pdf)',
              text,
          )
          text = text.replace(
              '- LaTeX source: [`paper/`](paper/)',
              '- [Complete LaTeX source](paper/MorphoQL_Paper_English.tex)',
          )
          text = re.sub(r'\n- Build locally: `\./build_paper\.sh`', '', text)
          if 'drive.google.com' in text or 'drive.usercontent.google.com' in text:
              raise SystemExit('A Drive link remains in README.md')
          root.write_text(text, encoding='utf-8')

          Path('paper/README.md').write_text(
              '# Paper\n\n'
              '**MorphoQL: Declarative Morphological Queries over Multiscale Wavelet Event Relations**  \n'
              'Redha Moulla — AXIA, France\n\n'
              '- [English paper (PDF)](MorphoQL_Paper_English.pdf)\n'
              '- [Complete LaTeX source](MorphoQL_Paper_English.tex)\n'
              '- Split source files: [`parts/`](parts/)\n\n'
              'The PDF and complete LaTeX source are stored directly in this repository.\n',
              encoding='utf-8',
          )
          PY

      - name: Commit the PDF and LaTeX source directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/materialize-paper-files.yml .github/workflows/publish-paper-pdf.yml
          git add README.md paper/README.md paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex
          git commit -m 'Add PDF and complete LaTeX source'
          git push
