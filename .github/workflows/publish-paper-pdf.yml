name: publish-paper-pdf

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-paper-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-paper-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize and validate the PDF and complete LaTeX source
        run: |
          set -euo pipefail
          mkdir -p paper
          python -m pip install --quiet 'gdown==5.2.0'
          gdown --id '1VyjRZYagfj_DO_BYkGeLcpS-T8VYBh8q' --output paper/MorphoQL_Paper_English.pdf

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          pdf_path = Path('paper/MorphoQL_Paper_English.pdf')
          pdf = pdf_path.read_bytes()
          expected_size = 319_871
          expected_sha256 = '81d88ea1deb0496800dbabc4b16fee6beb42fdf66ccd976525c50e2c5b725fb8'
          if len(pdf) != expected_size:
              raise SystemExit(f'Unexpected PDF size: {len(pdf)} != {expected_size}')
          if sha256(pdf).hexdigest() != expected_sha256:
              raise SystemExit('PDF SHA-256 mismatch')
          if not pdf.startswith(b'%PDF-') or b'%%EOF' not in pdf[-4096:]:
              raise SystemExit('Invalid PDF structure')
          print(f'Validated PDF: {len(pdf)} bytes, sha256={expected_sha256}')
          PY

          cat paper/parts/part_*.tex > paper/MorphoQL_Paper_English.tex
          grep -q 'MorphoQL: Declarative Morphological Queries' paper/MorphoQL_Paper_English.tex
          grep -q '\\end{document}' paper/MorphoQL_Paper_English.tex
          test "$(stat -c%s paper/MorphoQL_Paper_English.tex)" -eq 84847
          sha256sum paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex

      - name: Replace external links with repository-local files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          text = re.sub(
              r'- \[English paper \(PDF\)\]\([^\n]+\)',
              '- [English paper (PDF)](paper/MorphoQL_Paper_English.pdf)',
              text,
          )
          text = text.replace(
              '- LaTeX source: [`paper/`](paper/)',
              '- [Complete LaTeX source](paper/MorphoQL_Paper_English.tex)',
          )
          text = re.sub(r'\n- Build locally: `\./build_paper\.sh`', '', text)
          if 'drive.google.com' in text or 'drive.usercontent.google.com' in text:
              raise SystemExit('A Drive link remains in README.md')
          root.write_text(text, encoding='utf-8')

          paper_readme = (
              '# Paper\n\n'
              '**MorphoQL: Declarative Morphological Queries over Multiscale Wavelet Event Relations**  \n'
              'Redha Moulla — AXIA, France\n\n'
              '- [English paper (PDF)](MorphoQL_Paper_English.pdf)\n'
              '- [Complete LaTeX source](MorphoQL_Paper_English.tex)\n'
              '- Split LaTeX source: [`parts/`](parts/)\n'
          )
          Path('paper/README.md').write_text(paper_readme, encoding='utf-8')
          PY

      - name: Commit the PDF and LaTeX source directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-paper-pdf.yml
          git add README.md paper/README.md paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex
          git commit -m 'Add final PDF and complete LaTeX source'
          git push
