name: publish-paper-pdf

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-paper-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-paper-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate the paper figures from the repository data
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib
          python paper/make_figures.py
          test "$(find figures -maxdepth 1 -name '*_en.pdf' | wc -l)" -eq 8

      - name: Install the LaTeX toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-inter \
            latexmk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-xetex
          fc-cache -f

      - name: Build and validate the complete LaTeX source and PDF
        run: |
          set -euo pipefail
          cat paper/parts/part_*.tex > paper/MorphoQL_Paper_English.tex
          grep -q 'MorphoQL: Declarative Morphological Queries' paper/MorphoQL_Paper_English.tex
          grep -q '\\end{document}' paper/MorphoQL_Paper_English.tex
          test "$(stat -c%s paper/MorphoQL_Paper_English.tex)" -gt 80000

          (cd paper && latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error MorphoQL_Paper_English.tex)

          python - <<'PY'
          from pathlib import Path
          pdf = Path('paper/MorphoQL_Paper_English.pdf').read_bytes()
          if len(pdf) < 100_000:
              raise SystemExit(f'PDF is unexpectedly small: {len(pdf)} bytes')
          if not pdf.startswith(b'%PDF-'):
              raise SystemExit('Compiled file is not a PDF')
          if b'%%EOF' not in pdf[-4096:]:
              raise SystemExit('PDF end marker is missing')
          print(f'Validated PDF: {len(pdf)} bytes')
          PY
          test "$(pdfinfo paper/MorphoQL_Paper_English.pdf | awk '/^Pages:/ {print $2}')" -ge 25
          wc -c paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex
          sha256sum paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex > paper/SHA256SUMS

      - name: Make the repository self-contained
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          text = re.sub(
              r'- \[English paper \(PDF\)\]\([^\n]+\)',
              '- [English paper (PDF)](paper/MorphoQL_Paper_English.pdf)',
              text,
          )
          text = re.sub(
              r'- LaTeX source: \[`paper/`\]\(paper/\)',
              '- [Complete LaTeX source](paper/MorphoQL_Paper_English.tex)',
              text,
          )
          text = text.replace('- Build locally: `./build_paper.sh`', '- Rebuild locally: `./build_paper.sh`')
          text = re.sub(r'\n- \[Full reproducibility supplement\]\([^\n]+\)', '', text)
          text = re.sub(r'\n- \[English LaTeX source\]\([^\n]+\)', '', text)
          text = re.sub(r'\n- \[Final English PDF on Drive\]\([^\n]+\)', '', text)
          text = re.sub(r'\n- \[Reproducibility supplement\]\([^\n]+\)', '', text)
          if 'drive.google.com' in text or 'drive.usercontent.google.com' in text:
              raise SystemExit('A Drive link remains in README.md')
          root.write_text(text, encoding='utf-8')

          Path('paper/README.md').write_text(
              '# Paper\n\n'
              '**MorphoQL: Declarative Morphological Queries over Multiscale Wavelet Event Relations**  \n'
              'Redha Moulla - AXIA, France\n\n'
              '- [English paper (PDF)](MorphoQL_Paper_English.pdf)\n'
              '- [Complete LaTeX source](MorphoQL_Paper_English.tex)\n'
              '- Split LaTeX source: [`parts/`](parts/)\n'
              '- Rebuild from the repository root: `./build_paper.sh`\n',
              encoding='utf-8',
          )
          PY

      - name: Commit the PDF, LaTeX source, and figures directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md paper/README.md paper/MorphoQL_Paper_English.pdf paper/MorphoQL_Paper_English.tex paper/SHA256SUMS figures/*.pdf
          git commit -m 'Add final PDF and complete LaTeX source'
          git pull --rebase origin main
          git push origin HEAD:main
