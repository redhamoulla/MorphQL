name: publish-paper-pdf

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-paper-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the final English PDF
        run: |
          mkdir -p paper
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1VyjRZYagfj_DO_BYkGeLcpS-T8VYBh8q&export=download&confirm=t' \
            -o paper/MorphoQL_Paper_English.pdf
          test "$(stat -c%s paper/MorphoQL_Paper_English.pdf)" -eq 319871
          echo '81d88ea1deb0496800dbabc4b16fee6beb42fdf66ccd976525c50e2c5b725fb8  paper/MorphoQL_Paper_English.pdf' | sha256sum -c -
      - name: Commit the PDF to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/MorphoQL_Paper_English.pdf
          git commit -m 'Add final English paper PDF'
          git push
