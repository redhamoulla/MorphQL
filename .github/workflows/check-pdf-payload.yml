name: check-pdf-payload
on:
  push:
    branches: [agent/check-pdf-payload]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo "base64_chars=$(wc -c < .paper_payload/pdf.b64)"
          base64 -d .paper_payload/pdf.b64 > /tmp/paper.pdf
          echo "pdf_bytes=$(wc -c < /tmp/paper.pdf)"
          head -c 5 /tmp/paper.pdf
          echo
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader('/tmp/paper.pdf')
          print('pages=', len(reader.pages))
          PY
