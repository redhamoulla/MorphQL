name: check-pdf-payload
on:
  push:
    branches: [agent/check-pdf-payload]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          wc -c .paper_payload/pdf.b64 .paper_payload/test_02_03.bin
          sha256sum .paper_payload/test_02_03.bin
