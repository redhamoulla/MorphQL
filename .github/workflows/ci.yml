name: validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate parser, engines, provenance, and witnesses
        run: ./run_validation_fast.sh
