[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphoql-core"
version = "0.8.0"
description = "Declarative edge-chain queries over auditable multiscale time-series event relations"
requires-python = ">=3.11"
dependencies = [
  "lark>=1.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.12",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["morphoql", "wavelet_events"]
